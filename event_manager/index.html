<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="d-flex justify-content-end">
      <button id="dark-mode-toggle" class="btn btn-dark m-3">Dark Mode</button>
    </div>
    <div id="add-form" class="contents m-5 p-4 rounded rounded-1 shadow">
      <h1 class="text-center mb-5">Quản lý sự kiện</h1>

      <form class="row g-3 p-2">
        <div class="col-md-6">
          <label for="id" class="form-label"><b>Tên Sự Kiện: </b></label>
          <input type="text" class="form-control" id="name" />
          <p class="text-danger" id="error_name"></p>
        </div>
        <div class="col-md-6">
          <label for="name" class="form-label"><b>Ngày tổ chức: </b></label>
          <input type="date" class="form-control" id="date" />
          <p class="text-danger" id="error_date"></p>
        </div>
        <div class="col-md-6">
          <label for="price" class="form-label"><b>Địa điểm: </b></label>
          <input type="text" class="form-control" id="place" />
          <p class="text-danger" id="error_place"></p>
        </div>
        <div class="col-md-6">
          <label for="imgUrl" class="form-label"><b>Người tổ chưc: </b></label>
          <input type="text" class="form-control" id="host" />
          <p class="text-danger" id="error_host"></p>
        </div>
        <div class="col-12">
          <button
            type="button"
            class="btn btn-success"
            onclick="handleAddEvent()"
          >
            Thêm sự kiện
          </button>
        </div>
      </form>
    </div>
    <div id="contents" class="contents m-5 p-4 rounded rounded-1 shadow">
      <form id="form-search">
        <input
          class="form-control"
          id="keyword"
          type="search"
          aria-label="Search"
          placeholder="Tìm kiếm theo tên sự kiện..."
        />
      </form>

      <table class="table table-striped table-bordered border border-5">
        <thead class="table-dark text-white text-center">
          <tr>
            <th scope="col">Tên sự kiện</th>
            <th scope="col">Ngày</th>
            <th scope="col">Địa điểm</th>
            <th scope="col">Người tổ chức</th>
            <th scope="col" colspan="2">Hành động</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Modal EDIT -->
    <div
      class="modal fade"
      id="modal-edit"
      tabindex="-1"
      aria-labelledby="modalEditLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="modalEditLabel">
              Cập nhật sự kiện
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!--   body  -->
            <form class="row g-3 p-2">
              <div class="col-md-6">
                <label for="id" class="form-label"><b>Tên Sự Kiện: </b></label>
                <input type="text" class="form-control" id="edit_name" />
                <p class="text-danger" id="error_edit_name"></p>
              </div>
              <div class="col-md-6">
                <label for="name" class="form-label"
                  ><b>Ngày tổ chức: </b></label
                >
                <input type="date" class="form-control" id="edit_date" />
                <p class="text-danger" id="error_edit_date"></p>
              </div>
              <div class="col-md-6">
                <label for="price" class="form-label"><b>Địa điểm: </b></label>
                <input type="text" class="form-control" id="edit_place" />
                <p class="text-danger" id="error_edit_place"></p>
              </div>
              <div class="col-md-6">
                <label for="imgUrl" class="form-label"
                  ><b>Người tổ chưc: </b></label
                >
                <input type="text" class="form-control" id="edit_host" />
                <p class="text-danger" id="error_edit_host"></p>
              </div>
              <div class="col-12">
                <button
                  id="save-edit-btn"
                  type="button"
                  class="btn btn-success"
                >
                  Cập nhật
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
